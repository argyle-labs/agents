name: Agent Tests

# Structural tests for the agent roster (no network, no secrets). Behavioral +
# local suites need an ANTHROPIC_API_KEY / a local LLM and are run on demand,
# not in CI.

on:
  push:
    branches: [main]
    paths:
      - 'src/agents/**'
      - 'src/commands/**'
      - 'src/templates/**'
      - 'tests/**'
      - '.github/workflows/agent-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/agents/**'
      - 'src/commands/**'
      - 'src/templates/**'
      - 'tests/**'
      - '.github/workflows/agent-tests.yml'

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci

      # Fail if fixtures/agents-summary.txt has drifted from src/agents.
      - run: npm run check:summary

      - run: npm run test:structural
