[package]
name = "agents"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "Canonical base-agent-roster registrant: registers orca's base agents, slash-commands, and hooks via plugin_toolkit::agents against orca core"

[package.metadata.orca]
category = "agents"

[lib]
name = "agents"
path = "src/lib.rs"
# `rlib` only — the plugin artifact is the `[[bin]]` below, a dynamic subprocess
# orca's plugin-loader spawns and speaks the UDS wire protocol to. The retired
# cdylib crate-type is gone; there is no dlopened artifact anymore (mirrors the
# converted arr / dockge / ntfy subprocess plugins).
crate-type = ["rlib"]

# The subprocess plugin entrypoint. orca's boot-time scan spawns this binary and
# talks to it over the orca socket; `src/main.rs`'s `serve_tool_plugin!` emits
# the `fn main()` serve loop.
[[bin]]
name = "agents"
path = "src/main.rs"

[dependencies]
# The SOLE orca dependency and the only external crate this plugin names. Every
# surface it needs — the `agents.register` seam (`plugin_toolkit::agents`), the
# `AgentRegistration` wire struct (`plugin_toolkit::abi`), the `AgentDef` /
# `CommandDef` registry types (`plugin_toolkit::contract::agents`), `serde_json`,
# and the `serve_tool_plugin!` subprocess boot macro — is reached through it.
#
# THIN (out-of-process) profile: `default-features = false` sheds the in-process
# tokio reactor and the cdylib export glue. `tools` gives the `#[orca_tool]` /
# dispatch surface + the reactor-free `serve.rs` socket loop; `db` is the loop's
# other gate (`serve` / `serve_macros` are `#[cfg(all(feature = "tools", feature
# = "db"))]`). No tokio/futures/chrono/serde are named directly.
#
# Pinned to an orca `main` commit that carries the `plugin_toolkit::agents`
# registration seam + the `agents.register` host handler (merged in orca #58).
# Pinning a rev (not a bare branch) keeps CI reproducible and guarantees the
# seam is present — a lock/pin at an older orca would fail to resolve the seam.
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", rev = "9a993e5156737687e2c3ea00de514fe4e12e40d9", default-features = false, features = ["tools", "db"] }

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", rev = "9a993e5156737687e2c3ea00de514fe4e12e40d9", default-features = false, features = ["tools", "db"] }
tempfile = "3"

# Match orca's workspace lint floor: discarding a Result/Option via
# `let _ = ...` stays a hard error so the plugin remains portable back into the
# orca workspace.
[lints.clippy]
let_underscore_must_use = "deny"
