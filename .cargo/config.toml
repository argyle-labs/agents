# The orca repo is private. Resolve the `plugin-toolkit` git dependency through
# the git CLI so cargo inherits the operator's authenticated gh / ssh
# credentials (and, in CI, the tokenized `insteadOf` rewrite). Without this,
# cargo's built-in git transport can't fetch the private orca source.
[net]
git-fetch-with-cli = true

# No `[patch]` override: both local builds and CI resolve `plugin-toolkit` from
# the git rev pinned in Cargo.toml. (A local `[patch]` pointing at an on-disk
# orca checkout is intentionally omitted — it broke fresh builds whenever the
# sibling path was absent, and diverged from what CI actually compiles.)
